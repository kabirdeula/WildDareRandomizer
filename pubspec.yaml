name: wild_dare_randomizer
description: "A Flutter app for randomized Uno Dare rules with Firebase Hosting for web."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ^3.8.0

dependencies:
  cupertino_icons: ^1.0.6
  device_preview: ^1.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^17.0.1
  hive_ce: ^2.18.0
  hive_ce_flutter: ^2.3.4
  json_annotation: ^4.9.0
  logger: ^2.6.2
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  uuid: ^4.5.2

  # flutter_launcher_icons: ^0.14.1
  # flutter_native_splash: ^2.4.1

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.4
  hive_ce_generator: ^1.11.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/rules/system_rules.json
    - assets/fonts/poppins/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Black.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/poppins/Poppins-Light.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
